name: C1-C4 bounded replay
on:
  push:
    branches:
      - specialist-evolution-c1-c4-20260927
  workflow_dispatch:
jobs:
  c1-c4-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify admitted lineage
        run: |
          test -f specialist_evolution/c1_c4.py
          test -f tests/test_specialist_evolution_c1_c4.py
          git log -1 --oneline
      - name: Execute admitted deterministic harness
        run: python -m unittest tests.test_specialist_evolution_c1_c4 -v
