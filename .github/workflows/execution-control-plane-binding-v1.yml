name: execution-control-plane-binding-v1
# behavioral-harness-revision: 4-generated-bootstrap-zero-network
on:
  push:
    branches: [main]
    paths:
      - 'framepack/kaggle/control_plane_v1.py'
      - 'framepack/kaggle/framepack_inference.py'
      - 'framepack/kaggle/delivery_finalizer.py'
      - 'framepack/kaggle/inference_bootstrap_generated.template.py'
      - 'framepack/kaggle/generate_inference_bootstrap.py'
      - 'framepack/kaggle/inference_bootstrap_generated.py'
      - 'framepack/kaggle/test_control_plane_binding_v1.py'
      - '.github/workflows/execution-control-plane-binding-v1.yml'
  pull_request:
permissions: {contents: read}
jobs:
  fail-closed-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Deterministic generated artifact zero-diff
        run: |
          python framepack/kaggle/generate_inference_bootstrap.py
          git diff --exit-code -- framepack/kaggle/inference_bootstrap_generated.py
      - name: Big Tech runtime binding regressions
        run: python -m unittest -v framepack/kaggle/test_control_plane_binding_v1.py
