name: execution-control-plane-binding-v1
# behavioral-harness-revision: 2

on:
  push:
    branches: [main]
    paths:
      - 'framepack/kaggle/control_plane_v1.py'
      - 'framepack/kaggle/framepack_inference.py'
      - 'framepack/kaggle/inference_bootstrap_delivery_v2.py'
      - 'framepack/kaggle/test_control_plane_binding_v1.py'
      - '.github/workflows/execution-control-plane-binding-v1.yml'
  pull_request:
    paths:
      - 'framepack/kaggle/control_plane_v1.py'
      - 'framepack/kaggle/framepack_inference.py'
      - 'framepack/kaggle/inference_bootstrap_delivery_v2.py'
      - 'framepack/kaggle/test_control_plane_binding_v1.py'

permissions:
  contents: read

jobs:
  fail-closed-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Big Tech runtime binding regressions
        run: python -m unittest -v framepack/kaggle/test_control_plane_binding_v1.py
