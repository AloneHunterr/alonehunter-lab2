name: execution-control-plane-binding-v1-bootstrap
on:
  push:
    branches: [main]
    paths:
      - 'framepack/kaggle/generate_inference_bootstrap.py'
permissions:
  contents: write
jobs:
  generate-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python framepack/kaggle/generate_inference_bootstrap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framepack/kaggle/inference_bootstrap_generated.py
          git commit -m "build: generate self-contained admission bootstrap"
          git push
